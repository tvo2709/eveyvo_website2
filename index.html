<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EVEY VO — Portfolio Menu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@500;700&family=Bebas+Neue&family=Anton&display=swap"
    rel="stylesheet"
  />
  <!-- Dela Gothic One loaded separately so the request can't get garbled by the longer combined URL -->
  <link
    href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <!-- Subtle vignette + scanline grain to imitate game-menu UI -->
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Standalone vertical name (single instance, big) -->
  <div class="evey-tag" aria-hidden="true">HI! I'M EVEY VO</div>

  <!-- Top corner HUD -->
  <header class="hud-top">
    <div class="hud-brand">
      <span class="hud-dot"></span>
      <span class="hud-brand-text">PORTFOLIO/2026</span>
    </div>
    <div class="hud-status">
      <span class="hud-blink">●</span> ONLINE
    </div>
  </header>

  <main class="menu">
    <!-- BLUE STRIP 1 — INSTALLATIONS, slides Left → Right -->
    <section class="strip-section orange-section" data-direction="ltr" data-pos="top">
      <div class="strip-viewport">
        <div class="strip" id="strip-orange" aria-label="Installations carousel"></div>
        <div class="center-marker" aria-hidden="true">
          <div class="bracket bracket-l"></div>
          <div class="bracket bracket-r"></div>
        </div>
      </div>
      <div class="section-divider" aria-hidden="true"></div>
    </section>

    <!-- BLACK STRIP — STAGE DESIGN, slides Right → Left -->
    <section class="strip-section black-section" data-direction="rtl" data-pos="mid">
      <div class="strip-viewport">
        <div class="strip" id="strip-black" aria-label="Stage design carousel"></div>
        <div class="center-marker" aria-hidden="true">
          <div class="bracket bracket-l"></div>
          <div class="bracket bracket-r"></div>
        </div>
      </div>
      <div class="section-divider" aria-hidden="true"></div>
    </section>

    <!-- BLUE STRIP 2 — 3D ARTS, slides Left → Right -->
    <section class="strip-section orange-section" data-direction="ltr" data-pos="bot">
      <div class="strip-viewport">
        <div class="strip" id="strip-3d" aria-label="3D arts carousel"></div>
        <div class="center-marker" aria-hidden="true">
          <div class="bracket bracket-l"></div>
          <div class="bracket bracket-r"></div>
        </div>
      </div>
    </section>

    <!-- Section labels overlaid on the menu, anchored at section intersections -->
    <div class="menu-labels" aria-hidden="false">
      <div class="section-label section-label-anchor-top" data-section-key="orange">
        <span class="label-num">01</span>
        <h2 class="label-title">INSTALLATIONS</h2>
        <span class="label-tag">/ SELECT TO VIEW</span>
      </div>
      <div class="section-label section-label-seam-1" data-section-key="black">
        <span class="label-num">02</span>
        <h2 class="label-title">STAGE DESIGN</h2>
        <span class="label-tag">/ SELECT TO VIEW</span>
      </div>
      <div class="section-label section-label-seam-2" data-section-key="threed">
        <span class="label-num">03</span>
        <h2 class="label-title">3D ARTS</h2>
        <span class="label-tag">/ SELECT TO VIEW</span>
      </div>
    </div>
  </main>

  <!-- Bottom HUD (button prompts) -->
  <footer class="hud-bottom">
    <span class="hud-key"><kbd>▲</kbd><kbd>▼</kbd> SECTION</span>
    <span class="hud-key"><kbd>◀</kbd><kbd>▶</kbd> NAVIGATE</span>
    <span class="hud-key"><kbd>↵</kbd> SELECT</span>
    <span class="hud-key"><kbd>ESC</kbd> BACK</span>
    <span class="hud-spacer"></span>
    <span class="hud-counter" id="hud-counter">— / —</span>
  </footer>

  <!-- Detail modal (hidden by default) -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-backdrop" data-modal-close></div>

    <div class="modal-window" role="document">
      <header class="modal-header">
        <div class="modal-tag">
          <span class="modal-num" id="modal-num">01</span>
          <span class="modal-section" id="modal-section">INSTALLATIONS</span>
          <span class="modal-year" id="modal-year">—</span>
        </div>
        <button class="modal-close" data-modal-close aria-label="Close detail">
          <span class="modal-close-x">✕</span>
          <span class="modal-close-label">ESC</span>
        </button>
      </header>

      <h2 class="modal-title" id="modal-title">—</h2>
      <p class="modal-subtitle" id="modal-subtitle">—</p>

      <div class="modal-hero">
        <video
          id="modal-video"
          controls
          preload="metadata"
          playsinline
          crossorigin="anonymous"
        ></video>
        <!-- Large image hero, shown for 3D Arts items in place of the video. -->
        <img id="modal-image" class="modal-hero-image" alt="" style="display:none;" />
        <div class="modal-hero-frame" aria-hidden="true">
          <div class="hero-bracket hero-bracket-tl"></div>
          <div class="hero-bracket hero-bracket-tr"></div>
          <div class="hero-bracket hero-bracket-bl"></div>
          <div class="hero-bracket hero-bracket-br"></div>
        </div>
      </div>

      <div class="modal-body">
        <aside class="modal-meta">
          <dl>
            <div><dt>TYPE</dt><dd id="modal-type">—</dd></div>
            <div><dt>LOCATION</dt><dd id="modal-location">—</dd></div>
            <div><dt>ROLE</dt><dd id="modal-role">—</dd></div>
          </dl>

          <h3 class="modal-meta-title">CREDITS</h3>
          <ul class="modal-credits" id="modal-credits"></ul>
        </aside>

        <article class="modal-text" id="modal-text"></article>
      </div>

      <section class="modal-gallery">
        <h3 class="modal-gallery-title">DOCUMENTATION</h3>
        <div class="modal-gallery-grid" id="modal-gallery"></div>
      </section>
    </div>
  </div>

  <script src="script.js?v=3"></script>
</body>
</html>
